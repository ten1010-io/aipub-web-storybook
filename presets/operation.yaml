          resources:
            requests:
              cpu: '1'
              memory: 1Gi
              # ten1010.io/gpu-block-63mb-a2000: "1"
            limits:
              cpu: '1'
              memory: 1Gi
              # ten1010.io/gpu-block-63mb-a2000: "1" # requests와 동일해야 함
